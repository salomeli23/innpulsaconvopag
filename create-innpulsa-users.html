<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Usuarios InnPulsa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }
        h1 {
            color: #CC0C2E;
        }
        button {
            background-color: #CC0C2E;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 0;
        }
        button:hover {
            background-color: #A00A25;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
        .loading {
            background-color: #d1ecf1;
            color: #0c5460;
        }
        .user-result {
            padding: 8px;
            margin: 5px 0;
            border-left: 3px solid #ccc;
            padding-left: 10px;
            font-size: 14px;
        }
        .user-success {
            border-left-color: #28a745;
            background-color: #f0fff0;
        }
        .user-error {
            border-left-color: #dc3545;
            background-color: #fff5f5;
        }
        .summary {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Crear Usuarios InnPulsa</h1>
    <p>Este script creará todos los usuarios administrativos de InnPulsa.</p>

    <button id="createButton" onclick="createUsers()">Crear Usuarios</button>
    <button onclick="listUsers()">Ver Usuarios Existentes</button>

    <div id="result"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://xpuiytzblbodqdaoxiet.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhwdWl5dHpibGJvZHFkYW94aWV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDg3MTcwMTgsImV4cCI6MjAyNDI5MzAxOH0.qM7hI-1-3Q4Z5Z0Z5Z0Z5Z0Z5Z0Z5Z0Z5Z0Z5Z0Z5Z0';

        const users = [
            { email: 'jesus.morales', password: 'InnPulsa2026!Morales' },
            { email: 'oscar.uribe', password: 'InnPulsa2026!Ou' },
            { email: 'cindy.villarraga', password: 'InnPulsa2026!Villa' },
            { email: 'diana.diaz', password: 'InnPulsa2026!Diaz' },
            { email: 'jhony.ruiz', password: 'InnPulsa2026!Serrano' },
            { email: 'jhony.ruiz', password: 'InnPulsa2026!Ruiz' },
            { email: 'julian.rocha', password: 'InnPulsa2026!Rocha' },
            { email: 'juan.sandoval', password: 'InnPulsa2026!Sandoval' },
            { email: 'karen.rodriguez', password: 'InnPulsa2026!KRodriguez' },
            { email: 'karol.chaparro', password: 'InnPulsa2026!Chaparro' },
            { email: 'leonardo.perez', password: 'InnPulsa2026!Gomez' },
            { email: 'leonardo.perez', password: 'InnPulsa2026!Perez' },
            { email: 'marlon.castro', password: 'InnPulsa2026!Castro' },
            { email: 'richar.rodriguez', password: 'InnPulsa2026!Gantiva' },
            { email: 'richar.rodriguez', password: 'InnPulsa2026!RRodriguez' },
            { email: 'yenny.florez', password: 'InnPulsa2026!Florez' }
        ];

        async function createUsers() {
            const button = document.getElementById('createButton');
            const resultDiv = document.getElementById('result');

            button.disabled = true;
            resultDiv.className = 'loading';
            resultDiv.innerHTML = `<p>Procesando ${users.length} usuarios...</p>`;

            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/create-admin-users`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        users,
                        adminKey: 'innpulsa2026'
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Error: ${response.status} - ${errorText}`);
                }

                const result = await response.json();

                let html = '<div class="summary">';
                html += `Total: ${result.results.length} usuarios procesados<br>`;
                html += `Exitosos: ${result.results.filter(r => r.success).length}<br>`;
                html += `Errores: ${result.results.filter(r => !r.success).length}`;
                html += '</div>';

                result.results.forEach(user => {
                    const className = user.success ? 'user-success' : 'user-error';
                    const icon = user.success ? '✓' : '✗';
                    html += `<div class="user-result ${className}">${icon} ${user.email}: ${user.message}</div>`;
                });

                resultDiv.className = 'success';
                resultDiv.innerHTML = html;

            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = `<p>Error al crear usuarios: ${error.message}</p>`;
            } finally {
                button.disabled = false;
            }
        }

        async function listUsers() {
            const resultDiv = document.getElementById('result');

            resultDiv.className = 'loading';
            resultDiv.innerHTML = '<p>Cargando usuarios...</p>';

            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/list-admin-users`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        adminKey: 'innpulsa2026'
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Error: ${response.status} - ${errorText}`);
                }

                const result = await response.json();

                let html = '<div class="summary">';
                html += `Total de usuarios registrados: ${result.users.length}`;
                html += '</div>';

                result.users.forEach(user => {
                    const createdAt = new Date(user.created_at).toLocaleString('es-CO');
                    html += `<div class="user-result user-success">`;
                    html += `✓ ${user.email}<br>`;
                    html += `<small>ID: ${user.id} | Creado: ${createdAt}</small>`;
                    html += `</div>`;
                });

                resultDiv.className = 'success';
                resultDiv.innerHTML = html;

            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = `<p>Error al listar usuarios: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
