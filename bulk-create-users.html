<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Usuarios en Lote</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }
        h1 {
            color: #CC0C2E;
        }
        .input-section {
            margin-bottom: 30px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #333;
        }
        textarea {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #CC0C2E;
        }
        .help-text {
            margin-top: 8px;
            font-size: 14px;
            color: #666;
        }
        button {
            background-color: #CC0C2E;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #A00A25;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
        .loading {
            background-color: #d1ecf1;
            color: #0c5460;
        }
        .user-result {
            padding: 5px;
            margin: 5px 0;
            border-left: 3px solid #ccc;
            padding-left: 10px;
        }
        .user-success {
            border-left-color: #28a745;
        }
        .user-error {
            border-left-color: #dc3545;
        }
    </style>
</head>
<body>
    <h1>Crear Usuarios en Lote</h1>

    <div class="input-section">
        <label for="userInput">Ingrese los usuarios (un usuario por línea):</label>
        <textarea id="userInput" placeholder="Formato: correo@ejemplo.com	contraseña	Contraseña123

Ejemplo:
karen.rodriguez@innpulsacolombia.com	contraseña	InnPulsa2026!KRodriguez
juan.perez@innpulsacolombia.com	contraseña	InnPulsa2026!Perez"></textarea>
        <div class="help-text">
            Formato: <strong>email [TAB] texto "contraseña" [TAB] contraseña_real</strong>
            <br>Puede pegar directamente desde Excel o una hoja de cálculo.
        </div>
    </div>

    <button id="createButton" onclick="createUsers()">Crear Usuarios</button>

    <div id="result"></div>

    <script>
        const SUPABASE_URL = 'https://xpuiytzblbodqdaoxiet.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhwdWl5dHpibGJvZHFkYW94aWV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDg3MTcwMTgsImV4cCI6MjAyNDI5MzAxOH0.qM7hI-1-3Q4Z5Z0Z5Z0Z5Z0Z5Z0Z5Z0Z5Z0Z5Z0Z5Z0';

        function parseUserInput(inputText) {
            const lines = inputText.trim().split('\n');
            const users = [];

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const parts = line.split('\t');

                if (parts.length >= 3) {
                    const email = parts[0].trim();
                    const password = parts[2].trim();

                    if (email && password) {
                        users.push({ email, password });
                    }
                } else if (parts.length === 2) {
                    const email = parts[0].trim();
                    const password = parts[1].trim();

                    if (email && password) {
                        users.push({ email, password });
                    }
                }
            }

            return users;
        }

        async function createUsers() {
            const button = document.getElementById('createButton');
            const resultDiv = document.getElementById('result');
            const userInput = document.getElementById('userInput').value;

            if (!userInput.trim()) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = '<p>Por favor ingrese al menos un usuario.</p>';
                return;
            }

            const users = parseUserInput(userInput);

            if (users.length === 0) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = '<p>No se pudieron procesar los usuarios. Verifique el formato.</p>';
                return;
            }

            button.disabled = true;
            resultDiv.className = 'loading';
            resultDiv.innerHTML = `<p>Procesando ${users.length} usuario(s)...</p>`;

            try {
                const response = await fetch(
                    `${SUPABASE_URL}/functions/v1/create-admin-users`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        },
                        body: JSON.stringify({
                            users: users,
                            adminKey: 'innpulsa2026'
                        }),
                    }
                );

                const data = await response.json();

                if (data.results) {
                    let html = '<h3>Resultados:</h3>';
                    let successCount = 0;
                    let errorCount = 0;

                    data.results.forEach(result => {
                        if (result.success) {
                            successCount++;
                            html += `<div class="user-result user-success">✓ Usuario: ${result.email} - Creado exitosamente</div>`;
                        } else {
                            errorCount++;
                            html += `<div class="user-result user-error">✗ Usuario: ${result.email} - Error: ${result.error}</div>`;
                        }
                    });

                    html = `<p><strong>Total: ${users.length} usuarios | Exitosos: ${successCount} | Errores: ${errorCount}</strong></p>` + html;

                    if (errorCount === 0) {
                        resultDiv.className = 'success';
                    } else {
                        resultDiv.className = 'error';
                    }
                    resultDiv.innerHTML = html;
                } else if (data.error) {
                    resultDiv.className = 'error';
                    resultDiv.innerHTML = `<p>Error: ${data.error}</p>`;
                } else {
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = '<p>¡Todos los usuarios fueron creados exitosamente!</p>';
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = `<p>Error al crear usuarios: ${error.message}</p>`;
            } finally {
                button.disabled = false;
            }
        }
    </script>
</body>
</html>
